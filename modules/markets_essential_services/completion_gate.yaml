module: markets_essential_services
status: in_development
publication_ready: false
requirements:
  authoritative_acquisition:
    passed: false
    rule: "Acquire exact authoritative Jharkhand payloads or auditable dated exports; record source URL/resource ID, retrieval time, byte count, SHA-256 and observed media/schema."
  rights_review:
    passed: false
    rule: "Verify resource-level reuse rights, attribution, restrictions, privacy boundaries and third-party terms before redistribution."
  geographic_linkage:
    passed: false
    rule: "Link markets/services using authoritative identifiers or a verified temporal crosswalk; prohibit fuzzy/name-only joins and silent Census-2011/current-geography merging."
  provenance:
    passed: false
    rule: "Every published observation must retain source, period, geography vintage and transformation lineage."
  production_schema:
    passed: false
    rule: "Finalize schema only after real payload inspection; retain nulls and distinguish observed, derived and modelled values."
  indicators:
    passed: false
    rule: "Validate facility counts, service categories, market coverage and accessibility denominators only at supported inference levels; never infer missing services or convert missing to zero."
  validation:
    passed: false
    rule: "Run structural, geographic, temporal, null, duplicate, range, category, coordinate, rights, snapshot-provenance and source-specific checks."
  tests:
    passed: false
    rule: "Module-specific regression and governance tests must pass."
  streamlit:
    passed: false
    rule: "Show truthful IN DEVELOPMENT state, verified coverage, sources/methods, blockers and gaps; no unfinished evidence may appear published."
  downloads_reports:
    passed: false
    rule: "Provide research-ready exports/reports only for evidence that has passed all applicable source and validation gates."
  documentation:
    passed: false
    rule: "Document sources, rights, geography, temporal semantics, transformations, accessibility assumptions, validation, privacy boundaries and limitations."
  green_ci_main:
    passed: false
    rule: "All relevant CI must be green on the exact main commit containing the publication candidate."
completion_rule: "publication_ready may become true only when every requirement above is independently verified true on main."
