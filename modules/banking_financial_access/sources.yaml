notes:
  - "Official discovery confirms PMJDY publishes dated state-wise account-opening reports, including Jharkhand; these displayed values are not ingested as published JLA evidence in this activation step."
  - "RBI's Directory of Bank Offices provides an authoritative identity system for bank offices, but JLA must inspect actual reusable payload/export structure and temporal geography before integration."
  - "RBI BSR statistical releases are candidates for credit/deposit or inclusion indicators only at granularity actually supported by the acquired release."
  - "No missing banking observation may be interpreted as zero access, zero accounts, zero credit or zero deposits."
  - "No customer-, account-, beneficiary- or transaction-level financial data may enter the public evidence layer."
