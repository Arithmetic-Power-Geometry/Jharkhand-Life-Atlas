    authority: Reserve Bank of India
    source_type: official_directory
    url: https://m.rbi.org.in/SCRIPTs/aboutDirectory.aspx
    role: Candidate authoritative banking-office identity and location source; RBI documents Uniform Code Numbers for bank offices.
    acquisition_status: not_yet_acquired
    rights_status: pending_resource_level_review
    geography_status: pending_real_payload_inspection
    publication_status: blocked
  - id: rbi_bsr_credit
    authority: Reserve Bank of India
    source_type: official_statistical_release
    url: https://www.rbi.org.in/Scripts/Pr_DataRelease.aspx?DateFilter=Year&SectionID=376
    role: Candidate credit and banking statistical evidence; exact Jharkhand-supported inference level must be established from acquired releases.
    acquisition_status: not_yet_selected
    rights_status: pending_resource_level_review
    geography_status: pending_real_payload_inspection
    publication_status: blocked
  - id: pmjdy_statewise_accounts
    authority: Department of Financial Services, Ministry of Finance, Government of India
    source_type: official_dynamic_dashboard
    url: https://pmjdy.gov.in/statewise-statistics
    role: State-level PMJDY financial-inclusion account statistics; dynamic values require dated auditable snapshot provenance before use.
    acquisition_status: not_yet_acquired_as_auditable_snapshot
    rights_status: pending_resource_level_review
    geography_status: state_level_only_until_verified_otherwise
