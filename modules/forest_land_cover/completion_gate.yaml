module: forest_land_cover
status: in_development
publication_ready: false
requirements:
  authoritative_acquisition:
    passed: false
    rule: "Acquire exact authoritative Jharkhand forest/land-cover payloads, tables or auditable spatial exports; record source URL/resource ID, retrieval time, byte count, SHA-256 and observed media/schema."
  rights_review:
    passed: false
    rule: "Verify product/resource-level reuse rights, attribution, restrictions, spatial-service terms and conservation-sensitivity boundaries before redistribution."
  geographic_linkage:
    passed: false
    rule: "Link spatial evidence through authoritative coordinates/boundaries or verified temporal crosswalks; prohibit fuzzy/name-only joins and silent Census-2011/current-geography merging."
  provenance:
    passed: false
    rule: "Every published observation must retain source, assessment period/epoch, geography vintage, spatial scale/resolution, class legend and transformation lineage."
  production_schema:
    passed: false
    rule: "Finalize schema only after real payload inspection; preserve nulls and distinguish observed, classified, derived and modelled values."
  indicators:
    passed: false
    rule: "Validate forest/tree-cover classes, land-cover classes, area denominators and change semantics only at supported inference levels; never infer missing classes or convert missing to zero."
  validation:
    passed: false
    rule: "Run structural, CRS, geometry, geography, temporal, null, duplicate, range, class-legend, area-conservation, rights, provenance and source-specific checks."
  tests:
    passed: false
    rule: "Module-specific regression and governance tests must pass."
  streamlit:
    passed: false
    rule: "Show truthful IN DEVELOPMENT state, verified coverage, sources/methods, blockers and gaps; no unfinished evidence may appear published."
  downloads_reports:
    passed: false
    rule: "Provide research-ready exports/reports only for evidence that has passed all applicable source, rights, spatial and validation gates."
  documentation:
    passed: false
    rule: "Document sources, rights, geography, CRS, temporal semantics, product definitions, class legends, transformations, uncertainty/accuracy, sensitivity boundaries and limitations."
  green_ci_main:
    passed: false
    rule: "All relevant CI must be green on the exact main commit containing the publication candidate."
completion_rule: "publication_ready may become true only when every requirement above is independently verified true on main."
