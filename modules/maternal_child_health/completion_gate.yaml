module: maternal_child_health
protocol_version: 1
status: open
criteria:
  authoritative_acquisition:
    satisfied: false
    evidence: "Official HMIS/HMIS 2.0 and NFHS source families are identified, but no selected Jharkhand production payload has yet been acquired and hash/schema verified."
  rights_licence_review:
    satisfied: false
    evidence: "Exact export/API/file reuse, attribution and redistribution terms for the selected HMIS/NFHS resources remain to be verified before republication."
  smallest_authoritative_reusable_granularity:
    satisfied: false
    evidence: "HMIS is documented as facility-level and above with monthly reporting, but the smallest lawful reusable Jharkhand production payload has not yet been acquired; person-level RCH/MCTS records are excluded."
  cleaning_engineering:
    satisfied: false
    evidence: "No production Module 6 payload has yet been ingested; cleaning must preserve nulls, source periods, units and numerator/denominator semantics."
  geographic_linkage:
    satisfied: false
    evidence: "HMIS is documented as LGD-based, but exact exported geography identifiers and vintage must be inspected. Survey-wave and current geographies cannot be silently merged with Census 2011."
  provenance:
    satisfied: false
    evidence: "Source inventory exists, but exact retrieval resource, parameters, period, timestamp, payload hash and transformation lineage are pending."
  schema:
    satisfied: false
    evidence: "Prepublication module contract exists, but a production schema grounded in acquired source fields has not yet been finalized."
  indicators:
    satisfied: false
    evidence: "Maternal/child coverage or service indicators may not be published until numerator, denominator, reporting period, geography and aggregation semantics are verified."
  validation:
    satisfied: false
    evidence: "Production validation cannot pass before authoritative payload ingestion, privacy screening, indicator-semantic checks and geographic linkage."
  tests:
    satisfied: false
    evidence: "Governance tests are being established; ingestion, privacy, geography, denominator and indicator validation tests remain pending."
  streamlit_presentation:
    satisfied: false
    evidence: "Streamlit may show IN DEVELOPMENT metadata only; unfinished maternal/child evidence must not be presented as published data."
  downloadable_data_reports:
    satisfied: false
    evidence: "No Module 6 research-ready download or reproducible report exists yet."
  documentation:
    satisfied: false
    evidence: "Source inventory and module contract exist; schema, methods, provenance, validation, privacy and usage documentation remain incomplete."
  green_ci_on_main:
    satisfied: false
    evidence: "Final module completion requires a verified green CI run on the exact main commit satisfying every publication criterion."
completion_rule: "status may become complete only when every criterion is satisfied and final CI is green on main."
