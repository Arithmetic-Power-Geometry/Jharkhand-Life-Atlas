module: education_access
protocol_version: 1
status: open
verified_partial_evidence:
  historical_census_2011:
    status: validated_source_native_historical_extract
    data: data/curated/education_access/census_education_access_2011.csv
    provenance: data/curated/education_access/census_education_access_2011.provenance.json
    row_count: 32394
    thematic_field_count: 40
    reference_year: 2011
    rule: "Direct reviewed source-native projection only; preserve missing as null/blank representation and do not infer current UDISE+ school status or current-geography equivalence."
criteria:
  authoritative_acquisition:
    satisfied: false
    evidence: "Validated Census 2011 village education evidence exists, but the selected current UDISE+/OGD production payload has not yet been acquired and hash/schema verified."
  rights_licence_review:
    satisfied: false
    evidence: "The historical Census extract follows JLA's conservative derived-use policy. NDSAP/GODL-India applicability is identified for OGD resources, but exact current resource-level licence, attribution and API/export terms remain to be verified before reuse."
  smallest_authoritative_reusable_granularity:
    satisfied: false
    evidence: "Village-level historical evidence is published at source-native grain. The smallest lawful reusable current school-level production payload remains pending acquisition, and sensitive student/staff interfaces remain excluded."
  cleaning_engineering:
    satisfied: false
    evidence: "The Census 2011 Education extract is a validated direct projection with missingness preserved. Current UDISE+ production payload processing remains pending."
  geographic_linkage:
    satisfied: false
    evidence: "The historical extract remains explicitly on Census 2011 source-native geography. Current UDISE+ geography must be linked through authoritative identifiers or evidence-backed crosswalks; Census 2011 and current administrative geography cannot be silently merged."
  provenance:
    satisfied: false
    evidence: "The validated Census 2011 Education extract records source/output SHA-256 provenance. Current production retrieval URL/API parameters, academic year, retrieval timestamp, payload hash and transformation lineage remain pending."
  schema:
    satisfied: false
    evidence: "Historical source-native field selection is recorded in provenance, but the current production schema must be grounded in an actually acquired UDISE+/OGD payload."
  indicators:
    satisfied: false
    evidence: "Historical source fields are available without unsupported recoding. Current school-access, infrastructure, enrolment or teacher indicators may not be published until acquisition, geography, denominator and academic-year semantics are verified."
  validation:
    satisfied: false
    evidence: "The Census 2011 Education extract has validated row/field counts, hashes and provenance semantics. Full Module 5 validation remains open because current production outputs do not yet satisfy the publication gate."
  tests:
    satisfied: false
    evidence: "Historical-extract and governance validation exists, but completion still requires production ingestion, privacy, geographic-linkage and indicator tests on the final exact main head."
  streamlit_presentation:
    satisfied: true
    evidence: "Streamlit Research exposes the validated Census 2011 Education dataset only when its provenance status, reference year, output path and hashes pass the historical-evidence gate, and labels it as historical rather than current UDISE+ school status."
  downloadable_data_reports:
    satisfied: false
    evidence: "A provenance-gated historical Education CSV download exists. A complete research-ready report set and validated current/differently dated Education outputs remain pending."
  documentation:
    satisfied: false
    evidence: "Source inventory, module contract and historical provenance exist; complete current-source methods, schema, validation, privacy and usage documentation remain open."
  green_ci_on_main:
    satisfied: false
    evidence: "Final module completion requires verified green CI on the exact main commit satisfying every publication criterion."
completion_rule: "status may become complete only when every criterion is satisfied and final CI is green on main."
