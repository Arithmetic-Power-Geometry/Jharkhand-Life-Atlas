sources:
  - id: UDISE_PLUS_OFFICIAL
    title: UDISE+ official platform and school directory ecosystem
    publisher: Department of School Education & Literacy, Ministry of Education, Government of India
    authority: primary_official
    url: https://udiseplus.gov.in/
    scope: school directory, school profile, facilities, geography and academic-year reporting
    smallest_reusable_granularity: school_where_lawful_reusable_access_is_explicitly_permitted
    rights_status: exact public export_or_data_sharing_terms_must_be_reviewed_before_republication
    acquisition_status: official_system_verified_payload_not_acquired
    publishable: false
    notes: "UDISE+ is the authoritative school-information ecosystem. Authenticated access does not itself authorize republication. JLA must not ingest or expose student, PEN, mobile, staff-personal or other person-level records."

  - id: UDISE_PLUS_API_PORTAL
    title: UDISE+ API Developer Portal
    publisher: Department of School Education & Literacy, Ministry of Education, Government of India
    authority: primary_official
    url: https://api.udiseplus.gov.in/
    scope: school-code validation, school profiles, facilities and geography endpoints alongside restricted person-level endpoints
    smallest_reusable_granularity: school_for_non_sensitive_endpoints_subject_to_access_and_reuse_terms
    rights_status: access_and_reuse_terms_require_explicit_review_before_use
    acquisition_status: endpoint_capabilities_verified_credentials_and_reuse_review_pending
    publishable: false
    notes: "The official portal describes school-level APIs and also student/staff/mobile-linked endpoints. JLA must restrict itself to non-sensitive institutional evidence and never publish person-level records."

  - id: OGD_UDISE_GROUP
    title: Unified District Information System for Education datasets on OGD Platform India
    publisher: Ministry of Education, Department of School Education & Literacy
    authority: primary_official_open_data_catalog
    url: https://data.gov.in/dataset-group-name/Unified%20district%20information%20system%20for%20education
    scope: enrolment, teachers, school infrastructure/facilities, management and category aggregates
    smallest_reusable_granularity: exact_resource_specific; district_or_block_where_resource_fields_support_it
    released_under: National Data Sharing and Accessibility Policy (NDSAP)
    rights_status: Government Open Data License - India applies to published OGD resources; preserve resource-specific attribution and metadata
    acquisition_status: catalog_verified_exact_jharkhand_resource_selection_and_hash_pending
    publishable: false
    notes: "Catalog discovery is not payload acquisition. Select the smallest authoritative reusable Jharkhand resource, preserve academic year and source geography, and hash the exact acquired bytes before publication."

  - id: OGD_UDISE_INFRASTRUCTURE
    title: Schools by Availability of Infrastructure and Facilities, School Management and School Category (UDISE plus)
    publisher: Ministry of Education, Department of School Education & Literacy
    authority: primary_official_open_data_catalog
    url: https://www.data.gov.in/catalog/schools-availability-infrastructure-and-facilities-school-management-and-school-category
    scope: school infrastructure/facility aggregates by management and category
    released_under: National Data Sharing and Accessibility Policy (NDSAP)
    catalog_updated: 2021-12-28
    rights_status: Government Open Data License - India applies to published OGD resources; exact resource metadata and attribution must be preserved
    acquisition_status: catalog_verified_resource_and_academic_year_selection_pending
    publishable: false
    notes: "Useful historical UDISE+ infrastructure source family. Do not present old academic-year geography or values as current."
