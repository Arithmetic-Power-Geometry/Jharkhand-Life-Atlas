schema: JLA_ACQUISITION_CANDIDATES_V1
module_id: education_access
verified_on: '2026-09-08'
publication_allowed: false
candidates:
  - source_id: OGD_UDISE_PLUS_ENROLMENT_GROUP
    authority: Government of India Open Government Data Platform; UDISE+
    dataset_group_url: https://data.gov.in/dataset-group-name/Unified%20district%20information%20system%20for%20education
    dataset_family: Enrolment by Location, School Management, School Category and Social Category (UDISE plus)
    acquisition_state: authoritative_dataset_group_verified_exact_resource_selection_pending
    observed_fields_from_group_page:
      - ac_year
      - st_code
      - state_name
      - dt_code
      - district_name
      - block_cd
      - udise_block_name
      - loc_name
      - sch_category_id
      - school_category
      - sch_mgmt_id
      - sch_mgmt_name
      - caste_id
      - caste_name
    candidate_role: district_block_education_access_evidence
    required_before_use:
      - select_exact_resource_and_academic_year
      - acquire_exact_payload
      - record_sha256_and_byte_count
      - inspect_complete_observed_schema
      - explicitly_filter_jharkhand
      - verify_codebooks_and_units
      - verify_geography_vintage_for_state_district_block_codes
      - verify_rights_and_attribution
      - preserve_missing_as_null
      - suppress_or_aggregate_any_cells_that_raise_disclosure_risk
    limitations:
      - dataset_group_metadata_is_not_an_acquired_resource
      - enrolment_data_does_not_by_itself_measure_learning_quality_or_physical_access
rights_note: OGD platform states published datasets/resources are licensed under Government Open Data License - India; resource-level attribution must still be recorded.
rules:
  - exact_academic_year_must_be_explicit
  - geography_codes_must_not_be_name_matched_across_vintages_without_evidence
  - publication_gate_remains_closed_until_exact_resource_validation
