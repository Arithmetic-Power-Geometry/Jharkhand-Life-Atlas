    machine_payload_identity_state: unresolved
    machine_resource_id: null
    machine_payload_url: null
    identity_evidence_url: null
    identity_verified_at: null
    raw_payload_acquired: false
    raw_sha256: null
    raw_bytes: null
    schema_inspected: false
    publication_allowed: false
