module_id: health_access
registry_id: JLA_HEALTH_RESOURCE_IDENTITY_V1
purpose: >-
  Record canonical authoritative resource-page identities separately from catalog API
  identity and machine payload identities so stable official metadata can be verified
  without implying that bytes or a resource Data API endpoint have been acquired.

catalog_evidence:
  catalog_url: https://data.gov.in/catalog/hospital-directory-national-health-portal
  catalog_api_id: e48a8bcf-ff56-4f39-839d-095827ba2a18
  catalog_api_url: https://www.data.gov.in/apis/e48a8bcf-ff56-4f39-839d-095827ba2a18
  catalog_api_identity_state: verified_from_official_catalog_link
  catalog_api_verified_on: '2026-09-08'
  catalog_api_payload_retrieved: false
  catalog_api_retrieval_note: >-
    The official Catalog API link resolves this identifier, but retrieval timed out in
    the verification environment. This is catalog-level identity only and is not a
    resource UUID, resource Data API endpoint, or raw-data acquisition.

rights_evidence:
  platform_license: Government Open Data License - India
  license_url: https://data.gov.in/godl
  platform_terms_url: https://www.data.gov.in/terms-of-use
  reviewed_on: '2026-09-08'
  review_state: platform_and_catalog_rights_verified_resource_payload_still_requires_snapshot_attribution
  permitted_uses:
    - lawful_commercial_and_noncommercial_use
    - adaptation_and_derivative_works
    - publication_and_value_addition
  obligations:
    - acknowledge_data_provider
    - acknowledge_source
    - acknowledge_license
    - include_dataset_DOI_URL_or_URI
    - do_not_imply_provider_endorsement
  exclusions:
    - personal_information
    - nonshareable_or_sensitive_data
    - third_party_or_other_excluded_intellectual_property
  publication_note: >-
    JLA must preserve provider/source/license attribution for each acquired snapshot and
    must not publish person-level or otherwise excluded data merely because catalog
    metadata is public.

