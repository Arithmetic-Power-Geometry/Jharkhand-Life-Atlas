criteria:
  authoritative_acquisition:
    satisfied: false
    evidence: "A governed Census 2011 Health source and validated historical extract exist. The 2026-09-12 immutable HMIS catalog-control snapshot verifies that the targeted quarterly HMIS catalog exposes disabled Catalog API/ZIP controls and no explicit reusable child resource identity. The NFHS-5 official catalog API link is identity-verified, and a separate fail-closed evidence record captures the live/index OGD resource-listing divergence; neither establishes workbook possession. The 2026-09-13 current-facility audit likewise records that indexed OGD metadata advertises monthly resources updated in August 2026 while the live catalog is sandbox-labelled and renders no resources; this remains metadata-only evidence with no machine resource identity or acquired payload. Therefore no blocked source is inferred or published, and the preferred 2026 OGD facility payload plus production HMIS/NFHS/current sources are not yet all acquired and schema-verified."
  rights_licence_review:
    satisfied: true
    evidence: "modules/health_access/RIGHTS_LICENCE_REVIEW.md records the source-scoped publication decision: the historical Census extract follows JLA's conservative derived-use policy; OGD sources are reviewed under Government Open Data License - India with attribution while each payload remains separately gated; the NFHS-5 catalog/API identity and live/index surface evidence and the 2026-09-13 current-facility metadata refresh do not authorize publication of unacquired bytes; restricted ABDM HFR remains excluded pending established export/republication rights."
  smallest_authoritative_reusable_granularity:
    satisfied: false
    evidence: "Village-level historical Census evidence is published at source-native grain, but the preferred current facility-level OGD payload remains pending acquisition and the NFHS-5 district workbook remains unacquired. Indexed current-facility metadata does not establish reusable facility-level data."
  cleaning_engineering:
    satisfied: false
    evidence: "The Census 2011 Health extract has been processed through a validated direct-projection path with missingness preserved. Fail-closed facility, HMIS and NFHS ingestion engines exist, but production current/differently dated payloads have not yet been fully processed."
  geographic_linkage:
    satisfied: false
    evidence: "The historical extract remains explicitly on Census 2011 source-native geography. NFHS-5 district evidence remains tied to its 2019-2021 source geography until exact workbook bytes are acquired and an evidence-backed temporal crosswalk exists. The 2026-09-13 current-facility metadata audit establishes no facility rows or source-native administrative keys, so it cannot support current-to-historical equivalence. Current/differently dated facility geography still requires evidence-backed temporal crosswalks; name equality alone is prohibited."
  provenance:
    satisfied: false
    evidence: "The validated Census 2011 Health extract records source/output SHA-256 provenance. The 2026-09-12 HMIS catalog/control blocker evidence records immutable hashes for the inspected official surfaces and workflow artifact. NFHS-5 has an exact official catalog API-link identity record plus a fail-closed live/index surface-divergence record, but no raw workbook SHA-256 because authoritative workbook bytes were not acquired. The 2026-09-13 current-facility metadata refresh records the conflicting indexed/live authoritative observations but correctly has no raw payload SHA-256 because no production payload was acquired. Production retrieval hashes/API request provenance for acquired current/differently dated Health payloads remain pending."
  schema:
    satisfied: true
    evidence: "modules/health_access/schema.yaml defines facility and service-activity grains and missing-value rules; the historical Census extract also has observed source-native field selection recorded in provenance and a field-level Census-2011 data dictionary synchronized to the governed builder. Indexed field labels in the current-facility metadata audit are explicitly not treated as an observed payload schema."
  indicators:
    satisfied: false
    evidence: "A validated historical evidence table exists, but no unsupported derived current Health indicators may be published before authoritative acquisition, valid denominators/periods and geographic support are established. NFHS-5 catalog identity, indexed metadata, live/index divergence evidence and current-facility metadata cannot supply indicator values."
  validation:
    satisfied: false
    evidence: "The Census 2011 Health extract has validated row/field counts, hashes and provenance semantics. NFHS-5 and current-facility live/index divergence states are explicitly fail-closed and regression-tested, but full Module 2 validation remains open because current/differently dated production outputs do not yet satisfy the publication gate and the NFHS-5 workbook/current facility payloads are not yet acquired and inspected."
  tests:
    satisfied: true
    evidence: "Dedicated Health tests are present and the health-access-validation workflow executes the Module 2 test suite. Current-resource identity/status, HMIS immutable blocker evidence, NFHS-5 catalog identity, NFHS-5 live/index surface divergence and the 2026-09-13 current-facility metadata audit are regression-tested to remain fail-closed while machine payload identity, raw bytes, schema inspection, geographic linkage and publication permission are absent; the historical data dictionary is regression-tested against the exact 69-field governed builder and provenance hashes. Final completion still requires re-verification on the exact main head."
  streamlit_presentation:
    satisfied: true
    evidence: "Streamlit Research exposes the validated Census 2011 Health dataset only when its provenance status is validated_source_native_historical_extract and labels it as historical evidence rather than a current facility inventory. The Modules view separately exposes governed current-facility acquisition counters and blockers directly from the Health resource-identity registry; unresolved resources, catalog-only/divergent NFHS-5 evidence and metadata-only current-facility evidence remain non-publishable."
  downloadable_data_reports:
    satisfied: false
    evidence: "A provenance-gated historical Health CSV download and research-ready historical evidence report now exist. The full completion criterion remains open until required additional validated production datasets/reports for current or differently dated Health evidence are available."
  documentation:
    satisfied: true
    evidence: "Module README, source registry, schema, acquisition ledger, historical-extract provenance, field-level Census-2011 data dictionary, resource-identity registry, rights/licence review, historical evidence research report, immutable 2026-09-12 HMIS catalog/control blocker evidence, the 2026-09-12 NFHS-5 catalog API identity record, the 2026-09-12 NFHS-5 live/index surface-divergence record, and the 2026-09-13 current-facility metadata refresh are present and synchronized with repository truth."
  green_ci_on_main:
    satisfied: true
    evidence: "On exact main commit 00147992e59862339999b76afeada476f3457d50, health-access-validation run 34689403242 and repository-wide tests run 34689403248 both completed successfully on 2026-09-12. Scheduled Health acquisition workflows observed on that same head also completed successfully, while blocked sources remained fail-closed. Repository-wide tests subsequently recovered and are green on cdf2958d907d18274f43ae0674066f2071313234; the dedicated Health workflow was path-skipped on that tests-only repair commit. This preserves the last exact-head dual-workflow evidence without pretending an untriggered Health workflow ran on cdf2958. Any later main head must be re-verified independently before a final COMPLETE decision."
