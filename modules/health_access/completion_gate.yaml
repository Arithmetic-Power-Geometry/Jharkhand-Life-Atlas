criteria:
  authoritative_acquisition:
    satisfied: false
    evidence: "A governed Census 2011 Health source and validated historical extract exist. The 2026-09-12 immutable HMIS catalog-control snapshot verifies that the targeted quarterly HMIS catalog exposes disabled Catalog API/ZIP controls and no explicit reusable child resource identity. The NFHS-5 official catalog API link is now identity-verified but its workbook payload remains unacquired. Therefore no blocked source is inferred or published, and the preferred 2026 OGD facility payload plus production HMIS/NFHS/current sources are not yet all acquired and schema-verified."
  rights_licence_review:
    satisfied: true
    evidence: "modules/health_access/RIGHTS_LICENCE_REVIEW.md records the source-scoped publication decision: the historical Census extract follows JLA's conservative derived-use policy; OGD sources are reviewed under Government Open Data License - India with attribution while each payload remains separately gated; the NFHS-5 catalog/API identity does not authorize publication of unacquired workbook bytes; restricted ABDM HFR remains excluded pending established export/republication rights."
  smallest_authoritative_reusable_granularity:
    satisfied: false
    evidence: "Village-level historical Census evidence is published at source-native grain, but the preferred current facility-level OGD payload remains pending acquisition and the NFHS-5 district workbook remains unacquired."
  cleaning_engineering:
    satisfied: false
    evidence: "The Census 2011 Health extract has been processed through a validated direct-projection path with missingness preserved. Fail-closed facility, HMIS and NFHS ingestion engines exist, but production current/differently dated payloads have not yet been fully processed."
  geographic_linkage:
    satisfied: false
    evidence: "The historical extract remains explicitly on Census 2011 source-native geography. NFHS-5 district evidence remains tied to its 2019-2021 source geography until an evidence-backed temporal crosswalk exists. Current/differently dated facility geography still requires evidence-backed temporal crosswalks; name equality alone is prohibited."
  provenance:
    satisfied: false
    evidence: "The validated Census 2011 Health extract records source/output SHA-256 provenance. The 2026-09-12 HMIS catalog/control blocker evidence records immutable hashes for the inspected official surfaces and workflow artifact. NFHS-5 now has an exact official catalog API-link identity record, but no raw workbook SHA-256 because authoritative bytes were not acquired. Production retrieval hashes/API request provenance for acquired current/differently dated Health payloads remain pending."
  schema:
    satisfied: true
    evidence: "modules/health_access/schema.yaml defines facility and service-activity grains and missing-value rules; the historical Census extract also has observed source-native field selection recorded in provenance and a field-level Census-2011 data dictionary synchronized to the governed builder."
  indicators:
    satisfied: false
    evidence: "A validated historical evidence table exists, but no unsupported derived current Health indicators may be published before authoritative acquisition, valid denominators/periods and geographic support are established. NFHS-5 catalog metadata alone cannot supply indicator values."
  validation:
    satisfied: false
    evidence: "The Census 2011 Health extract has validated row/field counts, hashes and provenance semantics. Full Module 2 validation remains open because current/differently dated production outputs do not yet satisfy the publication gate and the NFHS-5 workbook is not yet acquired/inspected."
  tests:
    satisfied: true
    evidence: "Dedicated Health tests are present and the health-access-validation workflow executes the Module 2 test suite. Current-resource identity/status, HMIS immutable blocker evidence and NFHS-5 catalog identity are regression-tested to remain fail-closed while machine payload identity, raw bytes, schema inspection, geographic linkage and publication permission are absent; the historical data dictionary is regression-tested against the exact 69-field governed builder and provenance hashes. Final completion still requires re-verification on the exact main head."
  streamlit_presentation:
    satisfied: true
    evidence: "Streamlit Research exposes the validated Census 2011 Health dataset only when its provenance status is validated_source_native_historical_extract and labels it as historical evidence rather than a current facility inventory. The Modules view separately exposes governed current-facility acquisition counters and blockers directly from the Health resource-identity registry; unresolved resources and catalog-only NFHS-5 evidence remain visibly non-publishable."
  downloadable_data_reports:
    satisfied: false
    evidence: "A provenance-gated historical Health CSV download and research-ready historical evidence report now exist. The full completion criterion remains open until required additional validated production datasets/reports for current or differently dated Health evidence are available."
  documentation:
    satisfied: true
    evidence: "Module README, source registry, schema, acquisition ledger, historical-extract provenance, field-level Census-2011 data dictionary, resource-identity registry, rights/licence review, historical evidence research report, immutable 2026-09-12 HMIS catalog/control blocker evidence, and the 2026-09-12 NFHS-5 catalog API identity record are present and synchronized with repository truth."
  green_ci_on_main:
    satisfied: true
    evidence: "On exact main commit 00147992e59862339999b76afeada476f3457d50, health-access-validation run 34689403242 and repository-wide tests run 34689403248 both completed successfully on 2026-09-12. Scheduled Health acquisition workflows observed on that same head also completed successfully, while blocked sources remained fail-closed. This establishes the CI criterion for that verified head without changing any scientific completion gate; any later main head must be re-verified independently before a final COMPLETE decision."
completion_rule: "status may become complete only when every criterion is satisfied and final CI is green on the exact main head."
