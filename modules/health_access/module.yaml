id: health_access
name: Health & Healthcare Access
version: 0.3.0
status: active
description: "Authoritative, place-linked health-facility, service-capacity and healthcare-access evidence for Jharkhand."
geography:
  primary: place
  supports: [state, district, subdistrict, block, panchayat, village, town, facility]
temporal:
  type: multi_source_time_series
  views: [census_2011_health_amenities, historical_official_directories, dated_official_health_systems]
dependencies: [core_geography]
features:
  map: true
  download: true
  report: true
  comparison: true
  provenance: true
principles:
  - no_source_no_published_value
  - missing_is_not_zero
  - observed_derived_modelled_separated
  - no_person_level_health_records
  - historical_and_current_geographies_not_silently_merged
scope:
  facility_inventory: fail_closed_official_ogd_ingestion_engine_ready_source_file_acquisition_pending
  public_health_capacity: pending_authoritative_ingest
  service_activity: fail_closed_hmis_ingestion_engine_ready_source_file_acquisition_pending
  access_indicators: pending_verified_facility_geography
  private_facilities: source_discovery_and_rights_review
  quality_certification: source_discovery_and_rights_review
engineering:
  hmis_district_ingest: modules/health_access/ingest_hmis.py
  hmis_link_rule: unique_exact_normalized_name_to_census2011_district
  hmis_fuzzy_linking: prohibited
  facility_directory_ingest: modules/health_access/ingest_facilities.py
  facility_link_rule: unique_exact_normalized_name_to_census2011_district
  facility_cross_source_identity: prohibited_without_evidence_backed_match
  facility_source_identity: source_provided_identifier_required
  missing_numeric_policy: preserve_null_never_zero
  official_download_host_allowlist: data.gov.in
completion_gate: "Do not mark complete until acquisition, rights review, provenance, geographic linking, schema, indicators, validation, tests, Streamlit, downloads/reports and CI are verified on main."
