sources:
  - source_id: CENSUS_DCHB_JH_2011_HEALTH
    title: Jharkhand District Census Handbooks — village health amenities
    publisher: Office of the Registrar General & Census Commissioner, India
    url: https://censusindia.gov.in/nada/index.php/catalog/?sk=Jharkhand
    role: historical_village_health_amenities
    reference_year: 2011
    publication_class: DERIVED_ONLY
    license_review_status: reviewed_conservative
    notes: "Reuse only under JLA's existing conservative Census policy; preserve source fields and do not reinterpret missing facility values as zero."

  - source_id: OGD_HEALTH_CENTRES_DIRECTORY
    title: All India Health Centres Directory
    publisher: Ministry of Health and Family Welfare, Government of India
    url: https://www.data.gov.in/catalog/all-india-health-centres-directory
    role: official_health_facility_directory
    reference_year: historical_directory
    catalog_published_on: 2017-09-21
    catalog_updated_on: 2019-08-20
    catalog_packaging: zip_download_and_catalog_api
    advertised_granularity: facility
    advertised_facility_types: [primary_health_centre, sub_centre, community_health_centre, district_hospital, state_hospital]
    advertised_fields: [state_name, district_name, sub_district_name, location, facility_address, geolocation]
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_catalog_ndsap_and_ogdl_platform
    license_checked_on: 2026-09-06
    attribution_required: true
    notes: "Official catalog advertises facility-level PHC, sub-centre, CHC, district-hospital and state-hospital records with geolocation, state/district/subdistrict/location/address fields. The catalog exposes a ZIP download and Catalog API and was updated 2019-08-20. Treat as historical: acquire and hash the exact official package before publication and preserve its resource date; never label it current."

  - source_id: OGD_HOSPITAL_DIRECTORY_NHP
    title: Hospital Directory — National Health Portal
    publisher: Ministry of Health and Family Welfare / NIHFW
    url: https://www.data.gov.in/catalog/hospital-directory-national-health-portal
    role: hospital_directory_catalog
    reference_year: historical_catalog
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_ogdl_platform
    license_checked_on: 2026-09-06
    attribution_required: true
    catalog_published_on: 2015-08-13
    catalog_updated_on: 2018-01-12
    catalog_api_id: e48a8bcf-ff56-4f39-839d-095827ba2a18
    notes: "Catalog-level metadata is historical. The official Catalog API control resolves to identifier e48a8bcf-ff56-4f39-839d-095827ba2a18; this is a catalog identifier, not evidence that a resource payload has been acquired. Prefer the newest verified dated resource for acquisition; do not represent the catalog date as facility currency."

  - source_id: OGD_NIN_HEALTH_FACILITIES_GEO_2026
    title: NIN Health Facilities with Geo Code and additional parameters (updated till last month)
    publisher: National Institute of Health and Family Welfare / Ministry of Health and Family Welfare, Government of India
    url: https://www.data.gov.in/resource/nin-health-faclities-geo-code-and-additional-parameters-updated-till-last-month
    role: preferred_official_geocoded_health_facility_source
    reference_year: 2026
    resource_published_on: 2017-08-10
    resource_updated_on: 2026-08-11
    granularity: facility
    advertised_access: [csv_download_through_url, data_api, preview]
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_resource_catalog_and_ogdl_platform
    license_checked_on: 2026-09-06
    attribution_required: true
    notes: "The official OGD Hospital Directory catalog lists this high-value monthly facility resource as updated 2026-08-11 and exposes CSV-through-URL and Data API access. This is the preferred acquisition target for geocoded facility coverage. Do not publish from catalog metadata alone: first verify the exact API/download endpoint, acquire the bytes/records, record retrieval time and hash or API request provenance, inspect the real schema, filter Jharkhand explicitly, and preserve source record identity."

  - source_id: OGD_NHP_HOSPITAL_GEO_2026
    title: National Hospital Directory with Geo Code and additional parameters (updated till last month)
    publisher: National Institute of Health and Family Welfare / Ministry of Health and Family Welfare, Government of India
    url: https://www.data.gov.in/resource/national-hospital-directory-geo-code-and-additional-parameters-updated-till-last-month
    role: official_hospital_directory_geocoded_parallel_source
    reference_year: 2026
    resource_published_on: 2017-08-10
    resource_updated_on: 2026-08-11
    granularity: facility
    advertised_access: [csv_download, data_api, preview]
    advertised_file_size: 9.9 MB
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_resource_catalog_and_ogdl_platform
    license_checked_on: 2026-09-06
    attribution_required: true
    notes: "Fresh verification on 2026-09-06 shows the official OGD catalog now reports this resource updated 2026-08-11, not 2025-06-02. Keep it separate from the NIN Health Facilities resource: similar update dates do not establish record equivalence. Acquire, hash and schema-check independently before any comparison or union."

  - source_id: OGD_HMIS_JH_DISTRICT
    title: Item-wise monthly HMIS report at District level of Jharkhand
    publisher: Ministry of Health and Family Welfare, Government of India
    url: https://www.data.gov.in/catalog/item-wise-monthly-hmis-report-district-level-jharkhand
    role: district_service_activity_time_series
    reference_year: time_series
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_ogdl_catalog
    license_checked_on: 2026-09-06
    attribution_required: true
    catalog_published_on: 2020-12-23
    catalog_updated_on: 2021-05-25
    catalog_api_resource_id: f7daca9b-92d4-4c6c-886a-91bf94a7e27e
    notes: "Official catalog is explicitly released under NDSAP and the OGD platform applies GODL-India. District-level service/activity indicators only; never allocate district aggregates to villages or facilities. Preserve period, district, indicator and source metadata. Individual inspected historical resources may expose CSV download without a resource API."

  - source_id: ABDM_HFR
    title: Ayushman Bharat Digital Mission — Health Facility Registry
    publisher: National Health Authority, Government of India
    url: https://abdm.gov.in/health-facilities
    role: current_verified_facility_registry_candidate
    reference_year: current
    publication_class: RESTRICTED
    license_review_status: rights_and_export_mechanism_pending
    notes: "Authoritative registry candidate spanning public/private facilities. Do not scrape or redistribute until an official reusable export/API and terms are verified."

  - source_id: NHSRC_AAM
    title: Ayushman Arogya Mandir programme map/table
    publisher: National Health Systems Resource Centre / National Health Mission
    url: https://nhsrcindia.org/AB-HWCs-map-table
    role: state_level_current_programme_coverage
    reference_year: current_page
    publication_class: DERIVED_ONLY
    license_review_status: resource_specific_review_pending
    notes: "Useful for programme coverage verification; state totals must not be expanded into facility records without an authoritative facility-level source."

  - source_id: NHSRC_NQAS
    title: NQAS Certified Facilities
    publisher: National Health Systems Resource Centre / National Health Mission
    url: https://nhsrcindia.org/quality-map-home
    role: health_facility_quality_certification_candidate
    reference_year: current_page
    publication_class: DERIVED_ONLY
    license_review_status: resource_specific_review_pending
    notes: "Use only certified-facility information actually exposed by the official source, with validity dates preserved."

  - source_id: CBHI_NHP
    title: National Health Profile
    publisher: Central Bureau of Health Intelligence / DGHS / MoHFW
    url: https://cbhidghs.mohfw.gov.in/publications/national-health-profile
    role: state_national_health_system_context
    reference_year: annual
    publication_class: DERIVED_ONLY
    license_review_status: resource_specific_review_pending
    notes: "State/national context and time-series source; not a substitute for granular facility records."
