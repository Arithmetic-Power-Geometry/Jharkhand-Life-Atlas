    advertised_file_size: 54 KB
    data_api_status: unavailable_on_live_resource_page
    advertised_fields: [Indicator, S.No., Parameters, Type, "SubDistrict - _Pakur - Total [(A+B) or (C+D)]"]
    provisional_figures: true
    aggregation_semantics: "Total [(A+B) OR (C+D)] = [(Public Facilities + Private Facilities) OR (Rural Facilities + Urban Facilities)]"
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
