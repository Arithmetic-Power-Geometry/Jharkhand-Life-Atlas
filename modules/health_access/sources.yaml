  - source_id: OGD_NFHS5_DISTRICT_FACTSHEETS_2019_2021
    title: National Family Health Survey-5 (NFHS-5) — India Districts Factsheet Data (Provisional)
    publisher: Ministry of Health and Family Welfare / International Institute for Population Sciences
    url: https://www.data.gov.in/resource/india-districts-factsheets-national-family-health-survey-nfhs-5-2019-2021-provisional
    catalog_url: https://www.data.gov.in/catalog/national-family-health-survey-5-nfhs-5-india-districts-factsheet-data-provisional
    role: district_health_nutrition_outcome_context
    reference_year: 2019-2021
    resource_published_on: 2022-03-04
    resource_updated_on: 2026-08-11
    advertised_access: [xls_download, preview]
    data_api_status: unavailable_on_live_resource_page
    advertised_file_size: 740 KB
    advertised_granularity: district
    observed_preview_fields: [District Names, State/UT, Number of Households surveyed, Number of Women age 15-49 years interviewed, Number of Men age 15-54 years interviewed]
    publication_class: OPEN_WITH_ATTRIBUTION
    license: Government Open Data License - India
    license_url: https://www.data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf
    license_review_status: reviewed_ogdl_catalog_and_platform
    license_checked_on: 2026-09-10
    attribution_required: true
    acquisition_status: resource_verified_payload_not_acquired
    notes: "Live authoritative OGD resource-page verification shows an XLS download and preview, file size 740 KB, but explicitly states that the Data API for this resource does not exist. The source documents suppression/low-sample annotations: figures in parentheses may be based on 25-49 unweighted cases and an asterisk denotes percentages not shown for fewer than 25 unweighted cases. Before curation acquire and hash the exact XLS payload, inspect the observed workbook schema, explicitly filter Jharkhand, preserve survey-period and district-vintage semantics, and retain suppression/uncertainty annotations. District estimates must never be allocated to villages, facilities or persons."

