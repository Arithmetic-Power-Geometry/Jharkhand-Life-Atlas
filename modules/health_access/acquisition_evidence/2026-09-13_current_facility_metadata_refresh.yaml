  - The live catalog surface currently renders no resources and explicitly labels itself a sandbox/testing environment whose content may be incomplete or inaccurate.
  - The governed identity resolver found two explicit official direct-payload candidates for the National Hospital Directory resource; because more than one candidate remains, no canonical direct payload URL is selected.
  - The NIN Health Facilities resource remains unresolved with no machine resource identity or explicit direct payload candidate.
  - Advertised download and Data API controls do not establish a machine resource UUID, API endpoint, or acquired payload.
  - Indexed field labels are metadata evidence only and are not treated as an observed payload schema.
  - Conflicting live and indexed authoritative surfaces are treated as unresolved evidence, not reconciled by inference.
  - No facility row, Jharkhand subset, current-availability indicator, or cross-vintage geography relation is inferred from metadata or ambiguous identity evidence alone.

