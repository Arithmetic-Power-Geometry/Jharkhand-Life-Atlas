interpretation:
  - The authoritative OGD indexed catalog currently advertises two monthly facility resources with 11 August 2026 update metadata.
  - Advertised download and Data API controls do not establish a machine resource UUID, API endpoint, or acquired payload.
  - Indexed field labels are metadata evidence only and are not treated as an observed payload schema.
  - The standalone live catalog/resource surfaces can render differently from indexed representations; JLA therefore keeps acquisition fail-closed.
  - No facility row, Jharkhand subset, current-availability indicator, or cross-vintage geography relation is inferred from metadata alone.

required_next_evidence:
  - exact authoritative machine resource identity or official direct payload URL
