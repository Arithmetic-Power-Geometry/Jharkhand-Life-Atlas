fail_closed_rules:
  catalog_metadata_is_not_payload: true
  dashboard_visual_is_not_payload: true
  search_snippet_is_not_payload: true
  missing_is_not_zero: true
  person_level_health_records_prohibited: true
  unresolved_geography_must_not_be_fuzzy_joined: true
  historical_current_geography_must_not_be_silently_merged: true
parallel_safe_work_while_blocked:
