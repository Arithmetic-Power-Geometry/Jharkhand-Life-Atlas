  - newer_national_catalog_does_not_silently_replace_jharkhand_specific_series
  - national_payload_requires_explicit_jharkhand_filter_before_curated_use
  - district_aggregates_are_never_allocated_to_villages_or_facilities
  - failed_requests_do_not_satisfy_acquisition
  - hashes_and_byte_counts_exist_only_after_real_payload_acquisition
  - exact_resource_or_api_identifiers_are_never_inferred_from_titles_or_search_snippets
  - negative_endpoint_search_results_do_not_prove_endpoint_absence
  - inconsistent_catalog_rendering_is_recorded_as_a_blocker_not_bypassed
  - never_create_placeholder_payloads
  - missing_values_are_never_imputed_as_zero
