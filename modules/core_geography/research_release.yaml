release_gate:
  - Recompute all manuscript statistics directly from release artifacts before submission.
  - Generate tables and figures from version-pinned curated outputs, never by manual transcription.
  - Keep Census 2011 and current LGD as distinct administrative vintages unless an official evidence-backed crosswalk supports a linkage.
  - Keep the field-level data dictionary synchronized with the production schema, temporal views, provenance, null semantics, and licensing.
  - Record a clean reproducibility run and green CI for the exact release commit/tag.
  - Archive only redistributable artifacts and preserve source-specific attribution and licence terms.
  - Mint or register a DOI only after the versioned release package is frozen and verified.
  - Do not claim journal submission, acceptance, publication, peer review, or DOI registration until independently true.
