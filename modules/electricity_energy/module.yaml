id: electricity_energy
name: Electricity & Energy
version: 0.1.0
status: active
description: "Authoritative place-linked evidence on electricity access, supply context and energy infrastructure in Jharkhand. Architecture and source discovery are active; no Module 11 thematic evidence is yet published."
geography:
  primary: place
  supports: [state, district, block, gram_panchayat, village]
temporal:
  type: multi_source_period
  views: [dated_electrification_evidence, dated_supply_statistics, dated_infrastructure_evidence, census_2011_context]
dependencies: [core_geography]
features:
  map: true
  download: true
  report: true
  comparison: true
  provenance: true
principles:
  - no_source_no_published_value
  - missing_is_not_zero
  - observed_derived_modelled_separated
  - historical_and_current_geographies_not_silently_merged
  - smallest_authoritative_reusable_granularity
  - dynamic_dashboard_values_require_snapshot_provenance
scope:
  household_electrification: authoritative_source_discovery_and_rights_review_active
  electricity_supply: authoritative_aggregate_source_discovery_active
  distribution_infrastructure: authoritative_aggregate_source_discovery_active
  generation_capacity: authoritative_state_level_context_discovery_active
  census_context: verified_module1_census_2011_geography_only
  place_linkage: no_name_only_linkage_to_current_administration
engineering:
  geographic_backbone: core_geography
  fuzzy_linking: prohibited
  missing_numeric_policy: preserve_null_never_zero
  sensitive_data_policy: "Do not publish consumer names, account numbers, meter identifiers linked to persons, mobile numbers, billing histories, payment records, precise household coordinates, or other person-level identifiers."
  temporal_geography_policy: "Every electrification, supply or infrastructure observation must retain source date/period and geography vintage; Census 2011 and current administrative geography must not be silently merged."
  dynamic_source_policy: "Dashboard values that change over time require an auditable snapshot or export with retrieval timestamp and hash before publication; current web display alone is not sufficient provenance."
  publication_policy: fail_closed_until_source_payload_rights_geography_schema_indicator_semantics_and_validation_verified
completion_gate: "Do not mark complete until acquisition, rights review, provenance, geographic linking, schema, indicators, validation, tests, Streamlit, downloads/reports, documentation and CI are verified on main."
