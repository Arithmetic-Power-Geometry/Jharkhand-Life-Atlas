module: roads_transport_accessibility
status: in_development
publication_ready: false
requirements:
  authoritative_acquisition:
    passed: false
    rule: "Acquire exact authoritative Jharkhand payloads; record source URL/resource ID, retrieval time, byte count, SHA-256 and observed media/schema."
  rights_review:
    passed: false
    rule: "Verify resource-level reuse rights, attribution, restrictions and third-party boundaries before redistribution."
  geographic_linkage:
    passed: false
    rule: "Link using authoritative identifiers or a verified temporal crosswalk; prohibit fuzzy/name-only joins and silent Census-2011/current-geography merging."
  provenance:
    passed: false
    rule: "Every published observation or derived accessibility value must retain source, period, geography vintage and transformation lineage."
  production_schema:
    passed: false
    rule: "Finalize schema only after real payload inspection; retain nulls and distinguish observed, derived and modelled values."
  indicators:
    passed: false
    rule: "Validate road/connectivity semantics and any denominators; do not infer unavailable service or accessibility values."
  validation:
    passed: false
    rule: "Run structural, geographic, temporal, null, duplicate, range and source-specific checks; accessibility requires network/topology and reproducibility checks."
  tests:
    passed: false
    rule: "Module-specific regression and governance tests must pass."
  streamlit:
    passed: false
    rule: "Show truthful IN DEVELOPMENT state, verified coverage, methods, blockers and gaps; no unfinished evidence may appear published."
  downloads_reports:
    passed: false
    rule: "Provide research-ready exports/reports only for evidence that has passed all applicable source and validation gates."
  documentation:
    passed: false
    rule: "Document sources, rights, geography, temporal semantics, transformations, validation and limitations."
  green_ci_main:
    passed: false
    rule: "All relevant CI must be green on the exact main commit containing the publication candidate."
completion_rule: "publication_ready may become true only when every requirement above is independently verified true on main."
