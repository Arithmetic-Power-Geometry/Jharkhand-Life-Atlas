id: roads_transport_accessibility
name: Roads, Transport & Accessibility
version: 0.1.0
status: active
description: "Authoritative place-linked evidence on roads, transport connectivity and accessibility in Jharkhand. Architecture and source discovery are active; no Module 10 thematic evidence is yet published."
geography:
  primary: place
  supports: [state, district, block, gram_panchayat, village]
temporal:
  type: multi_source_period
  views: [dated_network_or_asset_evidence, dated_connectivity_statistics, census_2011_context]
dependencies: [core_geography]
features:
  map: true
  download: true
  report: true
  comparison: true
  provenance: true
principles:
  - no_source_no_published_value
  - missing_is_not_zero
  - observed_derived_modelled_separated
  - historical_and_current_geographies_not_silently_merged
  - smallest_authoritative_reusable_granularity
  - accessibility_outputs_require_verified_inputs_and_methods
scope:
  rural_roads: authoritative_source_discovery_and_rights_review_active
  road_network: authoritative_reusable_network_or_asset_source_discovery_active
  public_transport: authoritative_aggregate_source_discovery_active
  accessibility: architecture_only_until_verified_network_destinations_and_method_are_available
  census_context: verified_module1_census_2011_geography_only
  place_linkage: no_name_only_linkage_to_current_administration
engineering:
  geographic_backbone: core_geography
  fuzzy_linking: prohibited
  missing_numeric_policy: preserve_null_never_zero
  sensitive_data_policy: "Do not publish vehicle-owner, driver, passenger, phone, registration-linked personal data, precise movement traces, or other person-level identifiers."
  temporal_geography_policy: "Every road, asset, service or derived accessibility observation must retain source date/period and geography vintage; Census 2011 and current administrative geography must not be silently merged."
  accessibility_policy: "Do not publish travel-time, distance, catchment or opportunity-access metrics until network topology, destinations, impedance assumptions, geographic linkage and reproducibility tests are verified."
  publication_policy: fail_closed_until_source_payload_rights_geography_schema_indicator_semantics_and_validation_verified
completion_gate: "Do not mark complete until acquisition, rights review, provenance, geographic linking, schema, indicators, validation, tests, Streamlit, downloads/reports, documentation and CI are verified on main."
