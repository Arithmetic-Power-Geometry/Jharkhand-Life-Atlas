name: forest-land-cover-validation

on:
  push:
    branches: [main]
    paths:
      - 'modules/forest_land_cover/**'
      - 'tests/test_forest_land_cover*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/forest-land-cover-validation.yml'
  pull_request:
    paths:
      - 'modules/forest_land_cover/**'
      - 'tests/test_forest_land_cover*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/forest-land-cover-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest pyyaml
      - run: python -m compileall modules/forest_land_cover
      - run: pytest -q tests/test_forest_land_cover*.py
      - run: pytest -q
