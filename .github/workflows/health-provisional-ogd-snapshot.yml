name: health-provisional-ogd-snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'modules/health_access/capture_provisional_ogd_snapshot.py'
      - 'modules/health_access/audit_nhd_candidate_rows.py'
      - 'modules/health_access/national_hospital_directory_candidate_schema.json'
      - 'modules/health_access/national_hospital_directory_semantic_contract.json'
      - 'jla/privacy.py'
      - '.github/workflows/health-provisional-ogd-snapshot.yml'
      - 'tests/test_health_provisional_snapshot_contract.py'
      - 'tests/test_health_nhd_candidate_schema_contract.py'
      - 'tests/test_health_nhd_aggregate_row_audit.py'

permissions:
  contents: read

jobs:
  capture-provisional-authoritative-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Direct execution of module scripts puts modules/health_access on sys.path,
      # not the repository root. Keep shared jla/* governance services importable
      # without embedding path hacks in scientific acquisition code.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Capture exact bytes and inspect candidate schema
        run: |
          mkdir -p build/health_provisional_snapshot
          python modules/health_access/capture_provisional_ogd_snapshot.py \
            --url 'https://data.gov.in/sites/default/files/datafile/hospital_directory.csv' \
            --raw build/health_provisional_snapshot/hospital_directory.csv \
            --receipt build/health_provisional_snapshot/receipt.json \
            > build/health_provisional_snapshot/run.log
      - name: Enforce non-canonical privacy-safe fail-closed boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/health_provisional_snapshot/receipt.json').read_text())
          assert r['contract'] == 'JLA_PROVISIONAL_OGD_SNAPSHOT_V2'
          assert r['raw_snapshot_persisted'] is True
          assert r['raw_snapshot_scope'] == 'ephemeral_ci_workspace_only_not_artifact_export'
          assert r['schema_inspected'] is True
          assert r['row_values_recorded_in_receipt'] is False
          assert r['privacy_header_audit_performed'] is True
          assert r['privacy_review_required'] is True
          assert r['privacy_risk_column_count'] > 0
          assert len(r['sha256']) == 64 and r['byte_count'] > 0
          assert r['canonical_source_identity_resolved'] is False
          assert r['publication_allowed'] is False
          assert r['curated_dataset_emitted'] is False
          assert 'snapshot_is_candidate_level_evidence_not_canonical_source_selection' in r['rules']
          assert 'raw_candidate_bytes_must_not_be_exported_as_ci_artifacts' in r['rules']
          assert 'receipt_must_not_contain_source_row_values' in r['rules']
          assert 'privacy_risk_columns_require_exclusion_or_explicit_rights_and_safety_review_before_any_public_projection' in r['rules']
          assert 'missing_values_must_remain_missing_and_must_never_be_silently_zero_filled' in r['rules']
          assert 'no_person_level_sensitive_data_may_be_published' in r['rules']
          print(json.dumps({k:r[k] for k in ['sha256','byte_count','observed_column_count','observed_data_row_count','observed_row_width_mismatch_count','privacy_risk_columns']}, indent=2))
          PY
      - name: Enforce governed schema identity and privacy-safe candidate projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jla.privacy import privacy_risk_columns, public_projection_report

          receipt_path = Path('build/health_provisional_snapshot/receipt.json')
          contract_path = Path('modules/health_access/national_hospital_directory_candidate_schema.json')
          report_path = Path('build/health_provisional_snapshot/privacy_projection_report.json')

          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          contract = json.loads(contract_path.read_text(encoding='utf-8'))

          # Any source-byte or schema drift must fail closed. Updating this contract
          # requires an explicit evidence review rather than silently accepting drift.
          assert receipt['sha256'] == contract['source_sha256']
          assert receipt['byte_count'] == contract['source_byte_count']
          assert receipt['observed_columns'] == contract['observed_columns']
          assert receipt['observed_column_count'] == contract['observed_column_count']
          assert receipt['observed_data_row_count'] == contract['observed_data_row_count']
          assert receipt['observed_row_width_mismatch_count'] == contract['observed_row_width_mismatch_count']

          risk_names = [item['column'] for item in privacy_risk_columns(receipt['observed_columns'])]
          assert risk_names == contract['privacy_risk_columns']

          projection = public_projection_report(
              contract['candidate_public_projection'],
              source_header=receipt['observed_columns'],
          )
          assert projection['privacy_gate_passed'] is True
          assert projection['privacy_risk_columns'] == []
          assert projection['missing_selected_columns'] == []
          assert projection['row_values_inspected'] is False
          assert projection['row_values_recorded'] is False

          # Passing this privacy-only projection check does not authorize publication.
          assert contract['candidate_status'] == 'non_canonical_candidate_evidence'
          assert contract['publication_allowed'] is False
          assert contract['curated_dataset_emitted'] is False
          assert contract['geography_linkage_status'] == 'unresolved'
          assert receipt['publication_allowed'] is False

          governed_report = {
              'contract': 'JLA_HEALTH_NHD_LIVE_SCHEMA_BINDING_V1',
              'source_sha256': receipt['sha256'],
              'observed_column_count': receipt['observed_column_count'],
              'observed_data_row_count': receipt['observed_data_row_count'],
              'observed_row_width_mismatch_count': receipt['observed_row_width_mismatch_count'],
              'candidate_schema_contract': contract['contract'],
              'candidate_status': contract['candidate_status'],
              'privacy_projection': projection,
              'geography_linkage_status': contract['geography_linkage_status'],
              'publication_allowed': False,
              'row_values_recorded': False,
          }
          report_path.write_text(json.dumps(governed_report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Run aggregate-only Jharkhand, numeric-quality, and source-ID audit
        run: |
          python modules/health_access/audit_nhd_candidate_rows.py \
            --csv build/health_provisional_snapshot/hospital_directory.csv \
            --contract modules/health_access/national_hospital_directory_candidate_schema.json \
            --semantic-contract modules/health_access/national_hospital_directory_semantic_contract.json \
            --output build/health_provisional_snapshot/aggregate_row_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/health_provisional_snapshot/aggregate_row_audit.json').read_text())
          assert r['contract'] == 'JLA_HEALTH_NHD_AGGREGATE_ROW_AUDIT_V3'
          assert r['semantic_contract'] == 'JLA_HEALTH_NHD_SEMANTIC_CONTRACT_V1'
          assert r['source_rows_emitted'] is False
          assert r['privacy_risk_columns_read_for_output'] == []
          assert r['curated_dataset_emitted'] is False
          assert r['geography_linkage_status'] == 'unresolved'
          assert r['publication_allowed'] is False
          assert r['canonical_missing_representation'] is None
          assert r['missing_to_zero_allowed'] is False
          assert r['zero_is_observed_value_only'] is True
          assert r['source_missing_tokens'] == ['', 'NA', 'N/A', 'Blank']
          assert r['jharkhand_source_label_match']['establishes_administrative_equivalence'] is False
          assert r['state_identifier_audit']['administrative_equivalence_established'] is False
          assert r['district_identifier_audit']['administrative_equivalence_established'] is False
          for field, quality in r['numeric_candidate_quality'].items():
              assert quality['raw_values_emitted'] is False, field
              assert quality['future_curated_failed_parse_representation'] == 'null', field
          print(json.dumps({
              'jharkhand_rows': r['jharkhand_source_label_match']['row_count'],
              'district_labels': r['jharkhand_distinct_district_label_count'],
              'district_labels_with_multiple_ids': r['district_identifier_audit']['labels_with_multiple_ids_count'],
              'district_ids_with_multiple_labels': r['district_identifier_audit']['ids_with_multiple_labels_count'],
              'governed_missing_tokens': r['source_missing_tokens'],
              'numeric_candidate_quality': r['numeric_candidate_quality'],
          }, indent=2))
          PY
      - name: Remove raw candidate before artifact export
        run: |
          # The authoritative candidate contains contact/person fields. Preserve only
          # aggregate/cryptographic/schema/privacy receipts and logs; never export source rows.
          rm -f build/health_provisional_snapshot/hospital_directory.csv
          test ! -e build/health_provisional_snapshot/hospital_directory.csv
      - name: Upload governed aggregate receipts and run log only
        uses: actions/upload-artifact@v4
        with:
          name: health-provisional-ogd-snapshot-receipt-${{ github.run_id }}
          path: |
            build/health_provisional_snapshot/receipt.json
            build/health_provisional_snapshot/privacy_projection_report.json
            build/health_provisional_snapshot/aggregate_row_audit.json
            build/health_provisional_snapshot/run.log
          if-no-files-found: error
          retention-days: 90