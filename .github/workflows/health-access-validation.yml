name: health-access-validation

on:
  push:
    branches: [main]
    paths:
      - 'modules/health_access/**'
      - 'tests/test_health*.py'
      - 'tests/test_source_snapshot*.py'
      - 'tests/test_acquisition*.py'
      - 'data/curated/health_access/**'
      - 'app_pages/**'
      - 'scripts/**'
      - 'jla/source_snapshot.py'
      - 'jla/acquisition.py'
      - 'config/source_snapshot_contract.yaml'
      - 'config/acquisition_queue.yaml'
      - '.github/workflows/health-access-validation.yml'
  pull_request:
    paths:
      - 'modules/health_access/**'
      - 'tests/test_health*.py'
      - 'tests/test_source_snapshot*.py'
      - 'tests/test_acquisition*.py'
      - 'data/curated/health_access/**'
      - 'app_pages/**'
      - 'scripts/**'
      - 'jla/source_snapshot.py'
      - 'jla/acquisition.py'
      - 'config/source_snapshot_contract.yaml'
      - 'config/acquisition_queue.yaml'
      - '.github/workflows/health-access-validation.yml'
  workflow_dispatch:

jobs:
  validate-health-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Module 2 and shared acquisition code
        run: python -m compileall -q modules/health_access app_pages scripts jla
      - name: Run every Module 2 and shared acquisition-governance test
        run: pytest -q tests/test_health*.py tests/test_source_snapshot*.py tests/test_acquisition*.py
      - name: Run repository validation
        run: python scripts/check.py
