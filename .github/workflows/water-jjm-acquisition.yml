name: water-jjm-acquisition

on:
  push:
    branches: [main]
    paths:
      - 'modules/water_access/acquire_jjm_state_context.py'
      - 'modules/water_access/acquisition_candidates.yaml'
      - 'modules/water_access/source_coverage.csv'
      - '.github/workflows/water-jjm-acquisition.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  acquire-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Acquire authoritative JJM state-level context and inspect Jharkhand row
        id: acquire
        continue-on-error: true
        run: |
          mkdir -p build/water_jjm
          python modules/water_access/acquire_jjm_state_context.py --output-dir build/water_jjm 2>&1 | tee build/water_jjm/acquisition.log
          exit ${PIPESTATUS[0]}
      - name: Record authoritative-source access blocker
        if: steps.acquire.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('build/water_jjm')
          payload = {
              'contract': 'JLA_ACQUISITION_BLOCKER_V1',
              'source_id': 'OGD_RS_JJM_2025_STATE',
              'authority': 'Government of India Open Government Data Platform / Rajya Sabha; source note cites JJM-IMIS',
              'resource_page': 'https://www.data.gov.in/resource/stateut-wise-status-tap-water-connections-rural-households-under-jal-jeevan-mission-jjm-29',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'status': 'blocked_external_authoritative_payload_resolution_or_access',
              'raw_payload_acquired': False,
              'sha256_available': False,
              'observed_schema_available': False,
              'publication_allowed': False,
              'missing_values_may_be_converted_to_zero': False,
              'lower_geography_disaggregation_allowed': False,
              'resolution_rule': 'Retry only authoritative OGD links exposed by the official resource page; do not infer a datafile path and do not substitute mirrors.',
              'workflow_log': 'acquisition.log',
          }
          (out / 'acquisition_blocker.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY
      - name: Verify successful acquisition remains unpublished
        if: steps.acquire.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/water_jjm/jjm_acquisition_receipt.json').read_text(encoding='utf-8'))
          assert r['contract'] == 'JLA_SOURCE_SNAPSHOT_V1'
          assert r['byte_count'] > 500
          assert len(r['sha256']) == 64
          assert r['publication_allowed'] is False
          assert r['geography']['source_granularity'] == 'state_ut'
          assert r['geography']['lower_geography_disaggregation_allowed'] is False
          assert r['geography']['direct_name_equivalence_to_other_vintages_allowed'] is False
          schema = json.loads(Path('build/water_jjm/jjm_observed_schema.json').read_text(encoding='utf-8'))
          assert schema['jharkhand_rows'] == 1
          print(json.dumps(r, indent=2))
          PY
      - name: Verify external blocker remains fail-closed
        if: steps.acquire.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/water_jjm/acquisition_blocker.json').read_text(encoding='utf-8'))
          assert r['raw_payload_acquired'] is False
          assert r['sha256_available'] is False
          assert r['observed_schema_available'] is False
          assert r['publication_allowed'] is False
          assert r['missing_values_may_be_converted_to_zero'] is False
          assert r['lower_geography_disaggregation_allowed'] is False
          print(json.dumps(r, indent=2))
          PY
      - name: Upload governed acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-jjm-authoritative-acquisition-${{ github.run_id }}
          path: build/water_jjm/
          if-no-files-found: error
          retention-days: 90
