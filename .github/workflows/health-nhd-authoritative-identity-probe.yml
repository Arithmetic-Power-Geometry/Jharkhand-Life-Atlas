name: health-nhd-authoritative-identity-probe

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  probe-authoritative-resource-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe publisher resource surface and exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/health_nhd_identity_probe
          page='https://www.data.gov.in/resource/national-hospital-directory-geo-code-and-additional-parameters-updated-till-last-month'
          csv='https://www.data.gov.in/sites/default/files/datafile/hospital_directory.csv'
          curl --fail --location --silent --show-error \
            --dump-header build/health_nhd_identity_probe/resource.headers \
            --output build/health_nhd_identity_probe/resource.html "$page"
          curl --fail --location --silent --show-error \
            --dump-header build/health_nhd_identity_probe/csv.headers \
            --output build/health_nhd_identity_probe/hospital_directory.csv "$csv"
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          out = Path('build/health_nhd_identity_probe')
          page = (out / 'resource.html').read_text(encoding='utf-8', errors='replace')
          raw = (out / 'hospital_directory.csv').read_bytes()
          expected_sha = '1ddcad9f9b922142a4374c7b89b70fb6cefd8a257448c70a61e1c07d98845134'
          candidate_uuid = '98fa254e-c5f8-4910-a19b-4828939b477d'
          catalog_uuid = 'e48a8bcf-ff56-4f39-839d-095827ba2a18'
          static_csv_path = '/sites/default/files/datafile/hospital_directory.csv'
          sha = hashlib.sha256(raw).hexdigest()
          uuid_hits = sorted(set(re.findall(r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b', page)))

          # Machine-binding evidence must be structural, not name-based. We only
          # record booleans/counts; raw publisher HTML is never exported.
          script_blocks = re.findall(r'(?is)<script\b[^>]*>(.*?)</script>', page)
          candidate_lower = candidate_uuid.lower()
          csv_lower = static_csv_path.lower()
          same_script_blocks = [
              block for block in script_blocks
              if candidate_lower in block.lower() and csv_lower in block.lower()
          ]
          resource_uuid_api_refs = re.findall(
              rf'(?i)(?:api|resource)[^"\'<>\s]{{0,160}}{re.escape(candidate_uuid)}|'
              rf'{re.escape(candidate_uuid)}[^"\'<>\s]{{0,160}}(?:api|resource)',
              page,
          )
          resource_uuid_csv_refs = re.findall(
              rf'(?i){re.escape(candidate_uuid)}[^<]{{0,500}}{re.escape(static_csv_path)}|'
              rf'{re.escape(static_csv_path)}[^<]{{0,500}}{re.escape(candidate_uuid)}',
              page,
          )

          receipt = {
              'contract': 'JLA_HEALTH_NHD_AUTHORITATIVE_IDENTITY_PROBE_V2',
              'publisher_resource_url': 'https://www.data.gov.in/resource/national-hospital-directory-geo-code-and-additional-parameters-updated-till-last-month',
              'publisher_static_csv_url': 'https://www.data.gov.in/sites/default/files/datafile/hospital_directory.csv',
              'candidate_resource_uuid': candidate_uuid,
              'candidate_catalog_uuid': catalog_uuid,
              'candidate_resource_uuid_seen_on_live_publisher_page': candidate_lower in {u.lower() for u in uuid_hits},
              'candidate_catalog_uuid_seen_on_live_publisher_page': catalog_uuid.lower() in {u.lower() for u in uuid_hits},
              'publisher_page_uuid_hits': uuid_hits,
              'resource_uuid_and_csv_path_same_script_block': bool(same_script_blocks),
              'resource_uuid_and_csv_path_same_script_block_count': len(same_script_blocks),
              'resource_uuid_api_reference_count': len(resource_uuid_api_refs),
              'resource_uuid_csv_proximity_reference_count': len(resource_uuid_csv_refs),
              'csv_sha256': sha,
              'csv_byte_count': len(raw),
              'csv_matches_governed_candidate_sha256': sha == expected_sha,
              'canonical_source_identity_resolved': False,
              'publication_allowed': False,
              'rules': [
                  'uuid_presence_on_html_is_evidence_only_and_does_not_by_itself_bind_uuid_to_csv_bytes',
                  'structural_binding_signals_are_recorded_as_evidence_but_do_not_auto_open_the_canonical_identity_gate',
                  'canonical_identity_requires_explicit_review_of_authoritative_machine_binding_or_equivalent_publisher_evidence',
                  'no_name_only_geography_equivalence',
                  'missing_values_must_remain_missing',
                  'no_person_level_or_contact_data_may_be_exported',
              ],
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'drift.flag').write_text('1\n' if sha != expected_sha else '0\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert receipt['canonical_source_identity_resolved'] is False
          assert receipt['publication_allowed'] is False
          PY
      - name: Remove publisher HTML and sensitive raw CSV before artifact export
        if: always()
        run: |
          rm -f build/health_nhd_identity_probe/resource.html
          rm -f build/health_nhd_identity_probe/hospital_directory.csv
          test ! -e build/health_nhd_identity_probe/hospital_directory.csv
      - name: Upload provenance-only receipt and response headers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-nhd-authoritative-identity-probe-${{ github.run_id }}
          path: |
            build/health_nhd_identity_probe/receipt.json
            build/health_nhd_identity_probe/resource.headers
            build/health_nhd_identity_probe/csv.headers
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed on publisher CSV drift
        if: always()
        shell: bash
        run: |
          test -f build/health_nhd_identity_probe/drift.flag
          test "$(cat build/health_nhd_identity_probe/drift.flag)" = "0" || {
            echo 'Publisher static CSV drifted from governed candidate; provenance receipt preserved for explicit review.' >&2
            exit 1
          }
