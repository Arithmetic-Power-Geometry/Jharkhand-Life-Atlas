name: bootstrap-jla

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/module1-and-app
          fetch-depth: 0

      - name: Reconstruct tested package
        shell: bash
        run: |
          cat .bootstrap/chunk_* | base64 -d > /tmp/jla.tar.gz
          tar -xzf /tmp/jla.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install and validate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m compileall -q jla app_pages modules scripts streamlit_app.py
          pytest -q
          python scripts/check.py

      - name: Commit final repository tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Complete JLA v1.1.0 Module 1 and Streamlit app"
          git push origin HEAD:build/module1-and-app
