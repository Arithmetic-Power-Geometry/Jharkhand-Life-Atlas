name: roads-transport-accessibility-validation

on:
  push:
    branches: [main]
    paths:
      - 'modules/roads_transport_accessibility/**'
      - 'tests/test_roads_transport_accessibility*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/roads-transport-accessibility-validation.yml'
  pull_request:
    paths:
      - 'modules/roads_transport_accessibility/**'
      - 'tests/test_roads_transport_accessibility*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/roads-transport-accessibility-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest pyyaml
      - run: python -m compileall modules/roads_transport_accessibility
      - run: pytest -q tests/test_roads_transport_accessibility*.py
      - run: python scripts/validate.py
