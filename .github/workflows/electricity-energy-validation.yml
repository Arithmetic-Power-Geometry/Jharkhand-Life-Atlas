name: electricity-energy-validation

on:
  push:
    branches: [main]
    paths:
      - 'modules/electricity_energy/**'
      - 'tests/test_electricity_energy*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/electricity-energy-validation.yml'
  pull_request:
    paths:
      - 'modules/electricity_energy/**'
      - 'tests/test_electricity_energy*.py'
      - 'app_pages/**'
      - 'pyproject.toml'
      - '.github/workflows/electricity-energy-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest pyyaml
      - run: python -m compileall modules/electricity_energy
      - run: pytest -q tests/test_electricity_energy*.py
      - run: python scripts/validate.py
