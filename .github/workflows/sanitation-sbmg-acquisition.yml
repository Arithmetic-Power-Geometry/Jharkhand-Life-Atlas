name: sanitation-sbmg-acquisition

on:
  push:
    branches: [main]
    paths:
      - 'modules/sanitation_hygiene/acquire_sbmg_state_context.py'
      - 'modules/sanitation_hygiene/acquisition_candidates.yaml'
      - 'modules/sanitation_hygiene/source_coverage.csv'
      - '.github/workflows/sanitation-sbmg-acquisition.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  acquire-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Acquire authoritative SBM-G state context and inspect Jharkhand row
        id: acquire
        continue-on-error: true
        run: |
          mkdir -p build/sanitation_sbmg
          python modules/sanitation_hygiene/acquire_sbmg_state_context.py --output-dir build/sanitation_sbmg 2>&1 | tee build/sanitation_sbmg/acquisition.log
          exit ${PIPESTATUS[0]}
      - name: Record authoritative-source access blocker
        if: steps.acquire.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path('build/sanitation_sbmg')
          payload = {
              'contract': 'JLA_ACQUISITION_BLOCKER_V1',
              'source_id': 'OGD_SBMG_IHHL_CSC_2024_25',
              'authority': 'Government of India Open Government Data Platform / Rajya Sabha',
              'resource_page': 'https://ap.data.gov.in/resource/stateut-wise-number-households-individual-household-latrines-ihhls-and-community-sanitary',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'status': 'blocked_external_authoritative_payload_resolution_or_access',
              'raw_payload_acquired': False,
              'sha256_available': False,
              'observed_schema_available': False,
              'publication_allowed': False,
              'missing_values_may_be_converted_to_zero': False,
              'lower_geography_disaggregation_allowed': False,
              'semantic_guard': 'IHHL/CSC construction counts are not functionality, usage, sanitation quality, or ODF-sustainability evidence.',
              'resolution_rule': 'Retry only authoritative *.data.gov.in links exposed by the registered resource page; do not infer payload paths and do not substitute mirrors.',
              'workflow_log': 'acquisition.log',
          }
          (out / 'acquisition_blocker.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY
      - name: Verify successful acquisition remains unpublished
        if: steps.acquire.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/sanitation_sbmg/sbmg_acquisition_receipt.json').read_text(encoding='utf-8'))
          assert r['contract'] == 'JLA_SOURCE_SNAPSHOT_V1'
          assert r['byte_count'] > 500
          assert len(r['sha256']) == 64
          assert r['publication_allowed'] is False
          assert r['geography']['source_granularity'] == 'state_ut'
          assert r['geography']['lower_geography_disaggregation_allowed'] is False
          assert r['geography']['direct_name_equivalence_to_other_vintages_allowed'] is False
          schema = json.loads(Path('build/sanitation_sbmg/sbmg_observed_schema.json').read_text(encoding='utf-8'))
          assert schema['jharkhand_rows'] == 1
          print(json.dumps(r, indent=2))
          PY
      - name: Verify external blocker remains fail-closed
        if: steps.acquire.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/sanitation_sbmg/acquisition_blocker.json').read_text(encoding='utf-8'))
          assert r['raw_payload_acquired'] is False
          assert r['sha256_available'] is False
          assert r['observed_schema_available'] is False
          assert r['publication_allowed'] is False
          assert r['missing_values_may_be_converted_to_zero'] is False
          assert r['lower_geography_disaggregation_allowed'] is False
          print(json.dumps(r, indent=2))
          PY
      - name: Upload governed acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitation-sbmg-authoritative-acquisition-${{ github.run_id }}
          path: build/sanitation_sbmg/
          if-no-files-found: error
          retention-days: 90
