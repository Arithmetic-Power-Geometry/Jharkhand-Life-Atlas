name: core-geography-sync

on:
  push:
    paths:
      - 'modules/core_geography/sync_official.py'
      - 'modules/core_geography/sync_runner.py'
      - 'modules/core_geography/sync_fast_runner.py'
      - 'modules/core_geography/complete_module1.py'
      - 'modules/core_geography/complete_module1_v2.py'
      - '.github/workflows/core-geography-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ingestion dependencies
        run: pip install pandas openpyxl xlrd requests beautifulsoup4
      - name: Sync authoritative Census and LGD data
        run: python modules/core_geography/sync_fast_runner.py
      - name: Complete DCHB, MDDS and temporal crosswalk layers
        run: python modules/core_geography/complete_module1_v2.py
      - name: Validate repository
        run: |
          pip install -r requirements.txt pytest
          python -m compileall -q jla app_pages modules scripts streamlit_app.py
          pytest -q
          python scripts/check.py
      - name: Commit curated authoritative outputs
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curated/core_geography modules/core_geography/sync_report.json

          if git diff --cached --quiet; then
            echo 'No curated-data changes to commit.'
            exit 0
          fi

          git commit -m 'Sync authoritative Core Geography data [skip ci]'

          # main may have advanced while the long source sync was running.
          # Rebase the generated-data commit onto the latest main before pushing,
          # preserving unrelated README/UI/module changes rather than force-pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Curated Core Geography outputs pushed successfully.'
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another main update; retrying."
            sleep 3
          done

          echo 'Could not push curated outputs after 3 safe retries.' >&2
          exit 1
