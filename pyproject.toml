[project]
name = "jharkhand-life-atlas"
version = "1.0.0"
description = "Modular, provenance-first public-interest data infrastructure for Jharkhand"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
dependencies = [
  "streamlit>=1.63,<2",
  "polars>=1.30,<2",
  "duckdb>=1.5.5,<2",
  "pyarrow>=20,<30",
  "plotly>=7,<8",
  "PyYAML>=6,<7",
  "reportlab>=4.4,<5",
]

[tool.setuptools]
packages = ["jla"]

[tool.pytest.ini_options]
pythonpath = ["."]
